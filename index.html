<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conflux — Login (Direct Secret)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Inter',system-ui,sans-serif;
    background:linear-gradient(135deg,#1a1a2e,#16213e);
    color:#fff; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .card {
    background:rgba(37,37,64,.9);
    border:1px solid rgba(255,255,255,.1);
    border-radius:20px; padding:40px;
    max-width:520px; width:100%;
    text-align:center;
    backdrop-filter:blur(12px);
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .logo {
    width:80px; height:80px; margin:0 auto 20px;
    background:linear-gradient(135deg,#8B5CF6,#06B6D4);
    border-radius:20px;
    display:flex; align-items:center; justify-content:center;
    font-size:40px;
  }
  h1 { font-size:28px; font-weight:800; margin-bottom:8px; }
  .sub { color:#a1a1b8; margin-bottom:28px; font-size:15px; }
  .btn {
    display:inline-flex; align-items:center; justify-content:center;
    gap:10px; width:100%; padding:14px 24px;
    background:#5865F2; color:#fff; border:none;
    border-radius:12px; font-size:16px; font-weight:600;
    cursor:pointer; transition:.2s;
    text-decoration:none; font-family:inherit;
  }
  .btn:hover { background:#4752c4; transform:translateY(-2px); }
  .btn-logout {
    background:rgba(239,68,68,.15); color:#ef4444;
    border:1px solid rgba(239,68,68,.3);
    margin-top:20px;
  }
  .btn-logout:hover { background:rgba(239,68,68,.25); }
  .user {
    text-align:left; background:rgba(26,26,46,.6);
    padding:20px; border-radius:14px; margin-top:20px;
  }
  .user img {
    width:72px; height:72px; border-radius:50%;
    border:3px solid #8B5CF6; margin-bottom:10px;
  }
  .user h2 { font-size:20px; margin-bottom:4px; }
  .user p { color:#a1a1b8; font-size:14px; }
  .guild {
    display:flex; align-items:center; gap:10px;
    padding:8px 10px; background:rgba(37,37,64,.6);
    border-radius:8px; margin:6px 0; font-size:13px;
  }
  .guild img { width:28px; height:28px; border-radius:50%; margin:0; border:none; }
  .loading { padding:40px 20px; color:#a1a1b8; }
  .spinner {
    width:36px; height:36px;
    border:3px solid rgba(255,255,255,.1);
    border-top-color:#8B5CF6; border-radius:50%;
    animation:spin 1s linear infinite; margin:0 auto 16px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .hidden { display:none !important; }
  .error {
    background:rgba(239,68,68,.15); color:#ef4444;
    padding:12px; border-radius:8px; margin-bottom:16px;
    font-size:13px; text-align:left; word-break:break-word;
  }
  .warn {
    background:rgba(251,191,36,.15); color:#fbbf24;
    padding:12px; border-radius:8px; margin-bottom:16px;
    font-size:13px; text-align:left; line-height:1.5;
  }
  code { background:rgba(0,0,0,.3); padding:2px 6px; border-radius:4px; font-size:12px; }
</style>
</head>
<body>

<div class="card" id="card"></div>

<script>
// ============================================================
// ⚠️ SECRET NHÚNG TRỰC TIẾP VÀO HTML — NHƯ MÀY MUỐN
// ============================================================

const CONFIG = {
  CLIENT_ID:     '1556225313598472222',
  CLIENT_SECRET: '0viTuQuuHQlh0PPabxts8BUMbyYRILS0', // ❌ Sẽ lỗi invalid_client
  REDIRECT_URI:  window.location.origin + window.location.pathname,
  SCOPE:         'identify guilds'
};

const card = document.getElementById('card');

// ============================================================
// VIEWS
// ============================================================
function viewLogin(err) {
  card.innerHTML = `
    <div class="warn">
      ⚠️ <strong>Cảnh báo:</strong> Secret đang nhúng trong HTML.
      Nếu Discord đã flag secret này, login sẽ lỗi <code>invalid_client</code>.
    </div>
    ${err ? `<div class="error">❌ ${err}</div>` : ''}
    <div class="logo">🌌</div>
    <h1>Conflux</h1>
    <p class="sub">Where everything converges.</p>
    <button class="btn" id="loginBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
      </svg>
      Đăng nhập với Discord
    </button>
  `;
  document.getElementById('loginBtn').onclick = startOAuth;
}

function viewLoading(msg = 'Đang xử lý...') {
  card.innerHTML = `<div class="loading"><div class="spinner"></div><p>${msg}</p></div>`;
}

function viewUser(data) {
  const u = data.user;
  const avatar = u.avatar
    ? `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png?size=128`
    : 'https://cdn.discordapp.com/embed/avatars/0.png';

  const guildsHtml = data.guilds.slice(0, 10).map(g => {
    const icon = g.icon
      ? `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png?size=64`
      : 'https://cdn.discordapp.com/embed/avatars/0.png';
    return `<div class="guild"><img src="${icon}"><span>${g.name}</span></div>`;
  }).join('') || '<p style="color:#a1a1b8;font-size:13px;">Không có server nào bạn quản lý.</p>';

  card.innerHTML = `
    <div class="logo">🌌</div>
    <h1>Conflux</h1>
    <div class="user">
      <img src="${avatar}">
      <h2>${u.username}</h2>
      <p>ID: ${u.id}</p>
      <p style="margin-top:14px;color:#fff;font-weight:600;">
        📊 Server bạn quản lý (${data.guilds.length}/${data.total_guilds}):
      </p>
      ${guildsHtml}
    </div>
    <button class="btn btn-logout" onclick="logout()">🚪 Đăng xuất</button>
  `;
}

// ============================================================
// OAUTH2 — CÓ SECRET (CÁCH SAI)
// ============================================================

function startOAuth() {
  // Bước 1: redirect Discord xin code
  const params = new URLSearchParams({
    client_id:     CONFIG.CLIENT_ID,
    redirect_uri:  CONFIG.REDIRECT_URI,
    response_type: 'code',            // ← Code flow, cần secret đổi token
    scope:         CONFIG.SCOPE,
    prompt:        'consent'
  });
  window.location.href = `https://discord.com/oauth2/authorize?${params}`;
}

// Bước 2: khi Discord redirect về với ?code=xxx → đổi code lấy token
async function handleCallback(code) {
  viewLoading('Đang đổi code lấy token...');

  try {
    // ⚠️ GỌI DISCORD TRỰC TIẾP TỪ BROWSER — SAI VỀ MẶT BẢO MẬT
    const body = new URLSearchParams({
      client_id:     CONFIG.CLIENT_ID,
      client_secret: CONFIG.CLIENT_SECRET,   // ← SECRET LỘ Ở ĐÂY
      grant_type:    'authorization_code',
      code:          code,
      redirect_uri:  CONFIG.REDIRECT_URI
    });

    const res = await fetch('https://discord.com/api/v10/oauth2/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body
    });

    const data = await res.json();

    if (!res.ok) {
      // → invalid_client, invalid_grant, etc.
      const msg = data.error_description || data.error || `HTTP ${res.status}`;
      throw new Error(msg);
    }

    // Lưu token tạm
    sessionStorage.setItem('cfx_token', data.access_token);

    // Bước 3: lấy user + guilds
    await loadUser(data.access_token);

  } catch (e) {
    // Xoá code khỏi URL rồi hiện lỗi
    history.replaceState(null, '', window.location.pathname);
    viewLogin(e.message);
  }
}

// ============================================================
// LẤY USER + GUILDS
// ============================================================
async function loadUser(token) {
  viewLoading('Đang lấy thông tin...');

  try {
    const [user, guilds] = await Promise.all([
      fetch('https://discord.com/api/v10/users/@me', {
        headers: { Authorization: `Bearer ${token}` }
      }).then(r => {
        if (!r.ok) throw new Error('Không lấy được user');
        return r.json();
      }),
      fetch('https://discord.com/api/v10/users/@me/guilds', {
        headers: { Authorization: `Bearer ${token}` }
      }).then(r => r.json())
    ]);

    const managed = guilds.filter(g => {
      const p = parseInt(g.permissions || 0);
      return (p & 0x20) || (p & 0x8);
    });

    viewUser({
      user: {
        id: user.id,
        username: user.global_name || user.username,
        avatar: user.avatar
      },
      guilds: managed,
      total_guilds: guilds.length
    });

  } catch (e) {
    viewLogin(e.message);
  }
}

// ============================================================
// LOGOUT
// ============================================================
function logout() {
  sessionStorage.removeItem('cfx_token');
  history.replaceState(null, '', window.location.pathname);
  viewLogin();
}

// ============================================================
// INIT
// ============================================================
(function init() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const err = params.get('error');

  if (err) {
    viewLogin(`Discord trả lỗi: ${err}`);
    return;
  }

  if (code) {
    handleCallback(code);
    return;
  }

  // Nếu đã có token trong session → load lại user
  const token = sessionStorage.getItem('cfx_token');
  if (token) {
    loadUser(token);
    return;
  }

  viewLogin();
})();
</script>

</body>
</html>
